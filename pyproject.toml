[project]
name = "powertrace-sim"
version = "0.1.0"
description = "Architecture-aware LLM request timing and GPU power simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
]

[project.optional-dependencies]
train = [
    "scipy>=1.15.3",
]
paper = [
    "matplotlib>=3.10.8",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]
profiling = [
    "datasets>=4.7.0",
    "torch>=2.10.0",
    "transformers>=5.3.0",
]
archive-bigru = [
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "datasets>=4.7.0",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "transformers>=5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["model/tests"]
